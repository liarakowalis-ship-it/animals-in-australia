<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animals in Australia</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="animals-page">

    <div id="animal-overview">

        <h1 class="animals-title">ANIMALS IN AUSTRALIA</h1>

        <div class="animal-grid">

            <button class="animal-card" onclick="showAnimal('kangaroo')">
                <img src="kangaroo.jpg" alt="Kangaroo">
                <span>Kangaroo</span>
            </button>

            <button class="animal-card" onclick="showAnimal('koala')">
                <img src="koala.jpg" alt="Koala">
                <span>Koala</span>
            </button>

            <button class="animal-card" onclick="showAnimal('wombat')">
                <img src="wombat.jpg" alt="Wombat">
                <span>Wombat</span>
            </button>

            <button class="animal-card" onclick="showAnimal('quokka')">
                <img src="quokka.jpg" alt="Quokka">
                <span>Quokka</span>
            </button>

            <button class="animal-card" onclick="showAnimal('dingo')">
                <img src="dingo.jpg" alt="Dingo">
                <span>Dingo</span>
            </button>

            <button class="animal-card" onclick="showAnimal('emu')">
                <img src="emu.jpg" alt="Emu">
                <span>Emu</span>
            </button>

            <button class="animal-card" onclick="showAnimal('tasmanianDevil')">
                <img src="tasmanian-devil.jpg" alt="Tasmanian Devil">
                <span>Tasmanian Devil</span>
            </button>

            <button class="animal-card" onclick="showAnimal('platypus')">
                <img src="platypus.jpg" alt="Platypus">
                <span>Platypus</span>
            </button>

            <button class="animal-card" onclick="showAnimal('echidna')">
                <img src="echidna.jpg" alt="Echidna">
                <span>Echidna</span>
            </button>

            <button class="animal-card" onclick="showAnimal('thornyDevil')">
                <img src="thorny-devil.jpg" alt="Thorny Devil">
                <span>Thorny Devil</span>
            </button>

            <button class="animal-card" onclick="showAnimal('inlandTaipan')">
                <img src="inland-taipan.jpg" alt="Inland Taipan">
                <span>Inland Taipan</span>
            </button>

            <button class="animal-card" onclick="showAnimal('littlePenguin')">
                <img src="little-penguin.jpg" alt="Little Penguin">
                <span>Little Penguin</span>
            </button>

            <button class="animal-card" onclick="showAnimal('greatWhiteShark')">
                <img src="great-white-shark.jpg" alt="Great White Shark">
                <span>Great White Shark</span>
            </button>

            <button class="animal-card" onclick="showAnimal('huntsmanSpider')">
                <img src="huntsman-spider.jpg" alt="Huntsman Spider">
                <span>Huntsman Spider</span>
            </button>

            <button class="animal-card" onclick="showAnimal('jellyfish')">
                <img src="jellyfish.jpg" alt="Jellyfish">
                <span>Jellyfish</span>
            </button>

            <button class="animal-card" onclick="showAnimal('dolphin')">
                <img src="dolphin.jpg" alt="Dolphin">
                <span>Dolphin</span>
            </button>

        </div>

        <a href="index.html" class="back-button">← BACK TO HOME</a>

    </div>


    <div id="animal-information" style="display: none;">

        <div class="info-container">

            <button class="back-button" onclick="backToAnimals()">
                ← BACK TO ANIMALS
            </button>

            <h1 id="animal-name"></h1>

            <img id="animal-image" src="" alt="Animal">

            <div class="info-section">
                <h2>Habitat</h2>
                <p id="habitat"></p>
            </div>

            <div class="info-section">
                <h2>Look</h2>
                <ul id="look"></ul>
            </div>

            <div class="info-section">
                <h2>Characteristics</h2>
                <ul id="characteristics"></ul>
            </div>

            <div class="info-section">
                <h2>General Information</h2>
                <ul id="general"></ul>
            </div>

            <div class="info-section fun-fact">
                <h2>Fun Fact</h2>
                <p id="funfact"></p>
            </div>

            <button class="back-button bottom-button" onclick="backToAnimals()">
                ← BACK TO ANIMALS
            </button>

        </div>

    </div>


    <script src="animal.js"></script>

</body>
</html>
